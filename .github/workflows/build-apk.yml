name: Build and Release MonoDo APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes / Description'
        required: false
        default: 'Automated build triggered by developer Vishal Dhangar'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Android SDK Licenses & Secrets
        run: |
          # Automatically accept Android SDK licenses on the runner
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

          # Create .env from template if missing (required for Secrets plugin)
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          # Restore debug.keystore from base64 if needed
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Ensure gradlew exists and has execute permissions
          if [ ! -f ./gradlew ]; then
            gradle wrapper || true
          fi
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Prepare Versioned APK Files
        id: prepare_files
        run: |
          BUILD_NUM="${{ github.run_number }}"
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG="v1.0.${BUILD_NUM}"
          fi
          
          echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_OUTPUT
          
          mkdir -p output_apks
          
          # Find generated debug APK
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            VERSIONED_APK="output_apks/MonoDo-${VERSION_TAG}.apk"
            LATEST_APK="output_apks/MonoDo-latest.apk"
            
            cp "$APK_PATH" "$VERSIONED_APK"
            cp "$APK_PATH" "$LATEST_APK"
            
            echo "Successfully prepared: $VERSIONED_APK and $LATEST_APK"
          else
            echo "ERROR: Debug APK not found in app/build/outputs/apk/debug/"
            ls -la app/build/outputs/apk/ || true
            exit 1
          fi

      - name: Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MonoDo-APK-${{ steps.prepare_files.outputs.VERSION_TAG }}
          path: output_apks/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ steps.prepare_files.outputs.VERSION_TAG }}
          name: "MonoDo ${{ steps.prepare_files.outputs.VERSION_TAG }} - by Vishal Dhangar"
          body: |
            ## 📱 MonoDo - Minimalist Monochrome Task Manager
            **Created & Maintained by Vishal Dhangar**

            ### 🚀 Build Information:
            - **Version:** `${{ steps.prepare_files.outputs.VERSION_TAG }}`
            - **Commit:** `${{ github.sha }}`
            - **Notes:** ${{ github.event.inputs.release_notes || 'Clean APK generated automatically on push.' }}

            ### 📥 Download & Installation:
            1. Download **`MonoDo-${{ steps.prepare_files.outputs.VERSION_TAG }}.apk`** (or **`MonoDo-latest.apk`**) below.
            2. Open the file on your Android mobile.
            3. Tap **Install** (allow "Install Unknown Apps" if prompted).
          draft: false
          prerelease: false
          files: |
            output_apks/MonoDo-${{ steps.prepare_files.outputs.VERSION_TAG }}.apk
            output_apks/MonoDo-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
