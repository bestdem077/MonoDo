name: Build and Release MonoDo APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes / Custom Message'
        required: false
        default: 'Automated release generated on push by Vishal Dhangar'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Signing Keystore, Licenses and Secrets
        run: |
          echo "=== 1. Setting up debug.keystore ==="
          # Try restoring debug.keystore from base64 file if present
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          # If debug.keystore is still missing or empty, restore the canonical fixed keystore
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Restoring fixed canonical debug.keystore..."
            echo "" | base64 -d > debug.keystore 2>/dev/null || \
            echo "" | base64 --decode > debug.keystore 2>/dev/null || true
          fi

          # Fallback generation only if both above methods fail
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating fallback debug.keystore with keytool..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Mirror to user home ~/.android as well
          mkdir -p ~/.android
          cp -f debug.keystore ~/.android/debug.keystore || true
          ls -l debug.keystore

          echo "=== 2. Setting up dummy google-services.json ==="
          if [ ! -f app/google-services.json ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"123456789","project_id":"monodo-app","storage_bucket":"monodo-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.aistudio.monodo.prod"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKey"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef2","android_client_info":{"package_name":"com.aistudio.monodo.kxmpzq"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKey"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}]}' > app/google-services.json
          fi

          echo "=== 3. Setting up .env configuration ==="
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

          echo "=== 4. Accepting Android SDK Licenses ==="
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

          echo "=== 5. Ensuring gradlew has execute permission ==="
          if [ ! -f ./gradlew ]; then
            gradle wrapper || true
          fi
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Resolve Version Tag & Build Metadata
        id: resolve_version
        run: |
          BUILD_NUM="${{ github.run_number }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          BASE_VERSION=$(grep 'val baseVersionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || echo "2.1.0")
          BASE_CODE=$(grep 'val baseVersionCode = ' app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]*([0-9]+).*/\1/' || echo "10")
          VERSION_CODE=$((BASE_CODE + BUILD_NUM))

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG="v${BASE_VERSION}.${BUILD_NUM}"
          fi

          echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "BUILD_NUM=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        env:
          MONODO_RELEASE_TAG: ${{ steps.resolve_version.outputs.VERSION_TAG }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Process Versioning and Artifacts
        id: prepare_files
        run: |
          VERSION_TAG="${{ steps.resolve_version.outputs.VERSION_TAG }}"
          BASE_VERSION="${{ steps.resolve_version.outputs.BASE_VERSION }}"
          VERSION_CODE="${{ steps.resolve_version.outputs.VERSION_CODE }}"
          BUILD_NUM="${{ steps.resolve_version.outputs.BUILD_NUM }}"
          SHORT_SHA="${{ steps.resolve_version.outputs.SHORT_SHA }}"
          BUILD_DATE="${{ steps.resolve_version.outputs.BUILD_DATE }}"

          echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "BUILD_NUM=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_OUTPUT

          mkdir -p output_apks
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)

          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            VERSIONED_APK="output_apks/MonoDo-${VERSION_TAG}.apk"
            LATEST_APK="output_apks/MonoDo-latest.apk"

            cp "$APK_PATH" "$VERSIONED_APK"
            cp "$APK_PATH" "$LATEST_APK"

            APK_SIZE=$(du -h "$VERSIONED_APK" | cut -f1)
            APK_SHA256=$(sha256sum "$VERSIONED_APK" | cut -d' ' -f1)

            echo "APK_SIZE=${APK_SIZE}" >> $GITHUB_OUTPUT
            echo "APK_SHA256=${APK_SHA256}" >> $GITHUB_OUTPUT

            echo "Successfully prepared: $VERSIONED_APK and $LATEST_APK ($APK_SIZE, SHA: $APK_SHA256)"
          else
            echo "ERROR: Debug APK not found in app/build/outputs/apk/debug/"
            exit 1
          fi

      - name: Generate Professional Release Notes
        id: release_notes
        run: |
          RECENT_CHANGES=$(git log -n 5 --pretty=format:"* %s" 2>/dev/null || echo "* Performance improvements and refinements")

          cat << 'EOF' > RELEASE_BODY.md
          ## MonoDo — Minimalist Offline Task, Habit & Focus Workspace

          > **Crafted by Vishal Dhangar**  
          > 100% offline, privacy-first personal workspace with Swiss paper minimalism and Royal Blue accents. Installs directly over previous MonoDo builds without losing your data.

          ---

          ### What's New in ${{ steps.prepare_files.outputs.VERSION_TAG }}

          EOF

          printf '%s\n' "$RECENT_CHANGES" >> RELEASE_BODY.md

          cat << 'EOF' >> RELEASE_BODY.md

          ---

          ### Build Information

          | Specification | Details |
          |---|---|
          | **Release Version** | `${{ steps.prepare_files.outputs.VERSION_TAG }}` (Code `${{ steps.prepare_files.outputs.VERSION_CODE }}`) |
          | **Build Run** | `#${{ steps.prepare_files.outputs.BUILD_NUM }}` |
          | **Commit** | `${{ steps.prepare_files.outputs.SHORT_SHA }}` |
          | **Package Size** | `${{ steps.prepare_files.outputs.APK_SIZE }}` |
          | **Build Timestamp** | `${{ steps.prepare_files.outputs.BUILD_DATE }}` |
          | **Package ID** | `com.aistudio.monodo.kxmpzq` (In-place upgrade safe) |

          ---

          ### Download Assets

          * **[MonoDo-${{ steps.prepare_files.outputs.VERSION_TAG }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare_files.outputs.VERSION_TAG }}/MonoDo-${{ steps.prepare_files.outputs.VERSION_TAG }}.apk)** — Versioned APK
          * **[MonoDo-latest.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare_files.outputs.VERSION_TAG }}/MonoDo-latest.apk)** — Latest Stable APK

          ---

          ### Installation Guide for Android Devices

          1. **In-App Update (Recommended):** Open MonoDo -> Settings -> **App Updates** -> tap **Download & Install**.
          2. **Manual Download:** Or tap **`MonoDo-${{ steps.prepare_files.outputs.VERSION_TAG }}.apk`** / **`MonoDo-latest.apk`** below.
          3. **Data Safe:** Uses the same package ID and signing key, so your tasks, notes, habits, and birthdays stay intact.

          ---

          ### Integrity Checksum

          ```text
          SHA-256: ${{ steps.prepare_files.outputs.APK_SHA256 }}
          ```

          ---
          *Maintained & Published by **Vishal Dhangar** • Open-Source Productivity*
          EOF

      - name: Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MonoDo-APK-${{ steps.prepare_files.outputs.VERSION_TAG }}
          path: output_apks/*.apk
          retention-days: 30

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ steps.prepare_files.outputs.VERSION_TAG }}
          name: "MonoDo ${{ steps.prepare_files.outputs.VERSION_TAG }} — by Vishal Dhangar"
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
          files: |
            output_apks/MonoDo-${{ steps.prepare_files.outputs.VERSION_TAG }}.apk
            output_apks/MonoDo-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
