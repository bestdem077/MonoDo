name: Build and Release MonoDo APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes / Custom Message'
        required: false
        default: 'Automated release generated on push by Vishal Dhangar'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Signing Keystore, Licenses and Secrets
        run: |
          echo "=== 1. Setting up debug.keystore ==="
          # Try restoring debug.keystore from base64 file if present
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          # If debug.keystore is still missing or empty, restore the canonical fixed keystore
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Restoring fixed canonical debug.keystore..."
            echo "" | base64 -d > debug.keystore 2>/dev/null || \
            echo "" | base64 --decode > debug.keystore 2>/dev/null || true
          fi

          # Fallback generation only if both above methods fail
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating fallback debug.keystore with keytool..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Mirror to user home ~/.android as well
          mkdir -p ~/.android
          cp -f debug.keystore ~/.android/debug.keystore || true
          ls -l debug.keystore

          echo "=== 2. Setting up dummy google-services.json ==="
          if [ ! -f app/google-services.json ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"123456789","project_id":"monodo-app","storage_bucket":"monodo-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.aistudio.monodo.kxmpzq"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKey"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}]}' > app/google-services.json
          fi

          echo "=== 3. Setting up .env configuration ==="
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

          echo "=== 4. Accepting Android SDK Licenses ==="
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

          echo "=== 5. Ensuring gradlew has execute permission ==="
          if [ ! -f ./gradlew ]; then
            gradle wrapper || true
          fi
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Process Versioning and Artifacts
        id: prepare_files
        run: |
          BUILD_NUM="${{ github.run_number }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          # Extract base version from app/build.gradle.kts
          BASE_VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || echo "1.1.0")
          VERSION_CODE=$(grep 'versionCode = ' app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]*([0-9]+).*/\1/' || echo "2")

          # Dynamic Version Resolution
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG="v${BASE_VERSION}.${BUILD_NUM}"
          fi

          echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_OUTPUT
          echo "BUILD_NUM=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_OUTPUT

          mkdir -p output_apks
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)

          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            VERSIONED_APK="output_apks/MonoDo-${VERSION_TAG}.apk"
            LATEST_APK="output_apks/MonoDo-latest.apk"

            cp "$APK_PATH" "$VERSIONED_APK"
            cp "$APK_PATH" "$LATEST_APK"

            APK_SIZE=$(du -h "$VERSIONED_APK" | cut -f1)
            APK_SHA256=$(sha256sum "$VERSIONED_APK" | cut -d' ' -f1)

            echo "APK_SIZE=${APK_SIZE}" >> $GITHUB_OUTPUT
            echo "APK_SHA256=${APK_SHA256}" >> $GITHUB_OUTPUT

            echo "Successfully prepared: $VERSIONED_APK and $LATEST_APK ($APK_SIZE, SHA: $APK_SHA256)"
          else
            echo "ERROR: Debug APK not found in app/build/outputs/apk/debug/"
            exit 1
          fi

      - name: Generate Professional Release Notes
        id: release_notes
        run: |
          VERSION_TAG="${{ steps.prepare_files.outputs.VERSION_TAG }}"
          BUILD_DATE="${{ steps.prepare_files.outputs.BUILD_DATE }}"
          SHORT_SHA="${{ steps.prepare_files.outputs.SHORT_SHA }}"
          APK_SIZE="${{ steps.prepare_files.outputs.APK_SIZE }}"
          APK_SHA256="${{ steps.prepare_files.outputs.APK_SHA256 }}"
          CUSTOM_NOTES="${{ github.event.inputs.release_notes || 'Automated production build generated via GitHub Actions.' }}"

          cat << 'EOF' > RELEASE_BODY.md
          ## 🖤 MonoDo — Minimalist Task Manager

          > **Crafted with focus & elegance by Vishal Dhangar**  
          > A distraction-free, 100% offline personal task manager with habit streaks and subtask tracking.

          ---

          ### 📊 Build Information & Telemetry

          | Specification | Details |
          |---|---|
          | **Release Version** | `${{ steps.prepare_files.outputs.VERSION_TAG }}` |
          | **Build Run** | `#${{ steps.prepare_files.outputs.BUILD_NUM }}` |
          | **Commit Reference** | `${{ steps.prepare_files.outputs.SHORT_SHA }}` (`${{ github.sha }}`) |
          | **Package Size** | `${{ steps.prepare_files.outputs.APK_SIZE }}` |
          | **Build Timestamp** | `${{ steps.prepare_files.outputs.BUILD_DATE }}` |
          | **Compatibility** | Android 7.0+ (API 24 to 36) |
          | **Architecture** | Universal APK (arm64-v8a, armeabi-v7a, x86_64) |
          | **Author & Maintainer** | **Vishal Dhangar** |

          ---

          ### 🌟 Key Features in this Release (v1.1.0)
          
          * **🖤 Minimalist Monochrome UI with Royal Blue Accents:** Refined Swiss design aesthetic with vibrant Royal Blue highlights on active tabs, center FAB, streak badges, and action controls.
          * **📝 Local Notes Workspace:** Complete Room-backed notes manager with title/content search, custom categories, and pinning.
          * **📴 100% Offline, Clean & Private:** Production-ready zero dummy data. All tasks, notes, checklists, and streak counters are stored locally on your device in Android Room Database (SQLite).
          * **📳 Tactile Haptic Engine:** Satisfying mechanical vibrations on task completion, subtask ticks, creation, and deletion.
          * **🔥 Streak & Habit Tracking:** Tracks continuous productive days with a weekly activity matrix.
          * **✅ Subtask Checklists:** Break large objectives into bite-sized items with animated progress meters.
          * **⏰ Local Accountability Reminders:** Lightweight local notifications without battery drain.
          * **🛡️ One-Time Setup Guarantee:** Persistent onboarding that saves your profile once and never interrupts your workflow.

          ---

          ### 📥 Download Assets

          * 🔗 **[MonoDo-${{ steps.prepare_files.outputs.VERSION_TAG }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare_files.outputs.VERSION_TAG }}/MonoDo-${{ steps.prepare_files.outputs.VERSION_TAG }}.apk)** — Direct Versioned APK
          * 🔗 **[MonoDo-latest.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.prepare_files.outputs.VERSION_TAG }}/MonoDo-latest.apk)** — Always points to the newest stable release

          ---

          ### 📲 Installation Guide for Android Devices

          1. **Download:** Tap either **`MonoDo-${{ steps.prepare_files.outputs.VERSION_TAG }}.apk`** or **`MonoDo-latest.apk`** under the **Assets** section below.
          2. **⚠️ IMPORTANT NOTE (If updating from a previous version):**  
             * If your phone shows *"App not installed / Something went wrong"*, **first uninstall any old test version** from your phone (`Settings > Apps > MonoDo > Uninstall`). This is Android's standard security rule for signature verification.
          3. **Play Protect Prompt:**  
             * When prompted by Google Play Protect, tap **"More details"** ➔ **"Install anyway (unsafe)"**.  
             *(This appears because the APK is an open-source build directly from GitHub and not distributed through the Play Store).*
          4. **Enjoy MonoDo:** Open the app and start organizing with total focus!

          ---

          ### 🔒 Integrity Checksum

          ```text
          SHA-256: ${{ steps.prepare_files.outputs.APK_SHA256 }}
          ```

          ---
          *Maintained & Published by **Vishal Dhangar** • Open-Source Productivity*
          EOF

      - name: Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: MonoDo-APK-${{ steps.prepare_files.outputs.VERSION_TAG }}
          path: output_apks/*.apk
          retention-days: 30

      - name: Publish Official GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ steps.prepare_files.outputs.VERSION_TAG }}
          name: "MonoDo ${{ steps.prepare_files.outputs.VERSION_TAG }} — by Vishal Dhangar"
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
          files: |
            output_apks/MonoDo-${{ steps.prepare_files.outputs.VERSION_TAG }}.apk
            output_apks/MonoDo-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
